[project]
name = "inventory"
version = "0.1.0"
description = "一批待补 docstring 的工具模块"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
