[project]
name = "ordercalc"
version = "0.1.0"
description = "订单计价内核"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordercalc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
