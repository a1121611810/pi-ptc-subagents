[project]
name = "pkgkit"
version = "0.1.0"
description = "六个待出接口卡的小工具模块"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
