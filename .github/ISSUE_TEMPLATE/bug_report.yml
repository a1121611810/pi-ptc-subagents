name: Bug report
description: Something behaves differently from what the docs say it does
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Not a security problem? Please don't file it here — use GitHub's private
        reporting channel instead. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
      placeholder: |
        `ptc_run_code` returned `workerExit` on a program that …
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Smallest program or steps that reproduce it
      description: |
        A PTC program is ideal. If the problem is elsewhere (rendering, install,
        the `/ptc` command), say what you ran instead.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versions
      description: "`pi --version` and this package's version (`pi-ptc-subagents@…`)."
      placeholder: "pi 1.0.0 / pi-ptc-subagents 1.4.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - ptc_run_code
        - ptc_workflow
        - pi.dispatch / background dispatch
        - Rendering (TUI rows, sub-call tree, images)
        - Install / load
        - Not sure
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Trace output, a screenshot, or a link to a related issue.
    validations:
      required: false
