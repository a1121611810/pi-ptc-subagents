# CI for main pushes and pull requests. The Publish workflow (tag-triggered)
# keeps its own copy of the check chain and additionally publishes; this file
# exists so a red main between releases is caught without waiting for a tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三腿守 engines 声明（>=22.19）：下限 22 / 现行 24 / Active LTS 26（2026-10-28 起）
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run fmt:check
      # 不单独跑 build：`pnpm run test` 的 pretest 会先构建（pnpm 会跑 pre<script>）——
      # 显式再跑一次就是同一份产物构建两遍。
      - run: pnpm run test

  # 变异门禁（ADR-0029）：每条 mutant 必须被杀死，且杀死它的用例就是登记表 kills 指定的那条。
  # 只跑快腿四面（pi/output/kimi/standalone）——site/bench 面要站点产物与 uv，本来就不在 CI 上。
  # 依赖安装与 check job 重复是省不掉的（不同 runner）；但门禁自己会收窄重建产物，
  # 所以这里不预构建——预构建反而会被门禁的第一轮收窄重建覆盖掉。
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:mutations
