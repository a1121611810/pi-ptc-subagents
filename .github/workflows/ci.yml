# Per https://oxc.rs/docs/guide/usage/formatter/ci (npm variant; actions pinned to
# commit SHAs as the docs recommend).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
