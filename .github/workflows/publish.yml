# Publishes the package. Per ADR-0018: the tag is the release's identity — it names
# the commit the tarball is built from, and the job refuses to publish when the tag
# and `package.json` disagree.
#
# This workflow is registered on npmjs.com as the package's trusted publisher
# (https://docs.npmjs.com/trusted-publishers), so it authenticates with GitHub's
# OIDC token instead of a long-lived npm token. There is no NPM_TOKEN secret.
name: Publish

on:
  push:
    tags: [v*]

# `id-token: write` is what lets the npm CLI exchange a GitHub OIDC token for a
# short-lived publish credential. `contents: read` is needed for `checkout` on a
# private repository (the docs' samples assume a public repo where `permissions: {}`
# is enough). Same reason as ci.yml.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # pnpm/action-setup reads `packageManager: pnpm@…` from package.json and
      # prepares the matching pnpm version.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      # Node is pinned rather than `lts/*` (ci.yml's choice): trusted publishing
      # needs npm CLI >= 11.5.1, which ships with the runtime.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          # No `registry-url`: it would write `_authToken=${NODE_AUTH_TOKEN}` into
          # `.npmrc` with setup-node's placeholder value, and npm then treats that
          # placeholder as a real credential — so a failed OIDC exchange comes out as a
          # misleading 404 on PUT instead of "requires you to be logged in". ADR-0018 §2.
          package-manager-cache: false # npm docs: never cache in release builds
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      # `npm publish` runs `prepublishOnly` (typecheck + lint + fmt:check + build +
      # test) again. The duplication is deliberate — ADR-0018 §3.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run fmt:check
      # tests/tool-visibility.test.ts drives the built bundle (it loads dist/index.js
      # under a real pi), so the build has to happen before the tests. Same order as
      # prepublishOnly, for the same reason — ADR-0018 §3.
      - run: pnpm run build
      - run: pnpm test
      # No `--provenance`: npm generates attestations only for public source
      # repositories, and this repository is private (ADR-0018 §7). Verbose is the level
      # at which npm reports the OIDC exchange, so the release log records it instead of
      # hiding both success and failure (ADR-0018 §2).
      - run: npm publish --loglevel verbose
