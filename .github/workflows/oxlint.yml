# Per https://oxc.rs/docs/guide/usage/linter/ci (npm variant; actions pinned to
# commit SHAs as the docs recommend).
name: Lint

on:
  pull_request:
  push:
    branches: [main]

# `checkout` needs read access to this private repository (the docs' samples
# assume a public repo where `permissions: {}` is enough).
permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          # pnpm v12 detected via `packageManager: pnpm@…` in package.json
          # (setup-node v6 reads it and runs Corepack to install the version).
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
