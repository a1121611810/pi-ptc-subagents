# Per https://oxc.rs/docs/guide/usage/linter/ci (npm variant; actions pinned to
# commit SHAs as the docs recommend).
name: Lint

on:
  pull_request:
  push:
    branches: [main]

# `checkout` needs read access to clone. The repository is public now, so `permissions:
# {}` would be enough too; `contents: read` is kept because narrowing it is a change
# with CI risk and nothing here needs the narrowing.
permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # pnpm/action-setup reads `packageManager: pnpm@…` from package.json,
      # runs `corepack enable`, and prepares the matching pnpm version. This
      # is required because actions/setup-node with `cache: pnpm` verifies
      # the binary at setup time and will fail if pnpm isn't already
      # installed.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
