# pnpm 12 project config.
#
# `packages:` — the root is always a workspace member; this field adds the
# members beside it. `website` is the project site (VitePress, published to
# GitHub Pages). It is `private`, is excluded from the published npm package by
# the root `files` allowlist, and is deliberately NOT part of the root release
# gate: that gate asserts what the npm package ships. See the website ADR.
#
# The lockfile is the discipline this field creates. Every workflow in this
# repository installs with `--frozen-lockfile`, and a workspace member with
# dependencies that is absent from `pnpm-lock.yaml` fails that install with
# `ERR_PNPM_PACKAGE_MANAGER_NO_IMPORTER`. So: regenerate the lockfile and commit
# it in the SAME commit that adds or changes the website's dependencies.
#
# `allowBuilds` (added in pnpm 10.26, replaces the removed `onlyBuiltDependencies`):
# this project does not need any dependency's install/postinstall scripts.
# `rolldown` ships its own prebuilt native binary, `esbuild` is a transitive we
# never invoke directly, and `@google/genai` / `protobufjs` are not used at
# runtime. Listing each known transitive here with `false` documents that we
# reviewed them and chose not to run their scripts.
packages:
  - "packages/*"

allowBuilds:
  esbuild: false
  "@google/genai": false
  protobufjs: false
# pnpm 12.5 ships a default `minimumReleaseAge` that rejects packages
# published within the last ~24 h. For this project that delay adds friction
# (CI on `main` and a clean checkout on a developer box can be skewed by
# hours) without buying anything — the registry's existing metadata is the
# trust boundary we rely on. Pin to 0 so the lockfile resolves the same on
# every machine.
minimumReleaseAge: 0
